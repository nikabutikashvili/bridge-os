name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://bridge_os:bridge_os@localhost:5432/bridge_os_test
      TEST_DATABASE_URL: postgres://bridge_os:bridge_os@localhost:5432/bridge_os_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bridge_os_test
          POSTGRES_PASSWORD: bridge_os
          POSTGRES_USER: bridge_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_os -d bridge_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test database
        run: pnpm db:migrate

      - name: Seed test database
        env:
          NODE_ENV: development
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
