services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridge_os
      POSTGRES_PASSWORD: bridge_os
      POSTGRES_DB: bridge_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge_os -d bridge_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: runs Drizzle migrations, then upserts the demo fixture data.
  # Shares postgres's network namespace so DATABASE_URL can use "localhost",
  # which the db package's development-only seed guard requires.
  migrate:
    build:
      context: .
      target: build
    network_mode: "service:postgres"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bridge_os:bridge_os@localhost:5432/bridge_os
    command: sh -c "pnpm --filter @bridge-os/db db:migrate && pnpm --filter @bridge-os/db db:seed"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgres://bridge_os:bridge_os@postgres:5432/bridge_os
      DOCUMENT_STORAGE_ROOT: /app/data/documents
      DOCUMENT_MAX_UPLOAD_BYTES: 26214400
    ports:
      - "4000:4000"
    volumes:
      - api-documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://api:4000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  api-documents:
